name: Build Extension and Installer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      kubeedge_version:
        description: 'KubeEdge version'
        required: false
        default: 'v1.19.1'
      talos_version:
        description: 'Talos version for installer'
        required: false
        default: 'v1.12.2'
  workflow_call:
    inputs:
      kubeedge_version:
        description: 'KubeEdge version'
        required: false
        default: 'v1.19.1'
        type: string
      talos_version:
        description: 'Talos version for installer'
        required: false
        default: 'v1.12.2'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TALOS_VERSION: ${{ inputs.talos_version || github.event.inputs.talos_version || 'v1.12.2' }}
  OVERLAY_ID: 376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set version
        id: version
        run: |
          VERSION="${{ inputs.kubeedge_version || github.event.inputs.kubeedge_version || 'v1.19.1' }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EDGE_CORE_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Extension Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  build-installer:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        variant:
          - name: oracle
            platform: oracle-installer
          - name: metal
            platform: metal-installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set extension image tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "extension=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> $GITHUB_OUTPUT

      - name: Build Talos installer with extension
        run: |
          mkdir -p output
          docker run --rm --privileged \
            -v $PWD/output:/out \
            ghcr.io/siderolabs/imager:${{ env.TALOS_VERSION }} \
            --base-installer-image factory.talos.dev/${{ matrix.variant.platform }}/${{ env.OVERLAY_ID }}:${{ env.TALOS_VERSION }} \
            --system-extension-image ${{ steps.tag.outputs.extension }} \
            --output installer:/out/talos-kubeedge-installer.tar.gz \
            --arch amd64

      - name: Load installer image
        run: |
          docker load -i output/talos-kubeedge-installer.tar.gz

      - name: Tag installer image
        id: installer-tag
        run: |
          IMAGE_SHA=$(docker images --format "{{.ID}}" installer:latest | head -1)
          INSTALLER_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-installer:${{ matrix.variant.name }}-${{ steps.tag.outputs.tag }}"
          echo "sha=${IMAGE_SHA}" >> $GITHUB_OUTPUT
          echo "tag=${INSTALLER_TAG}" >> $GITHUB_OUTPUT
          docker tag ${IMAGE_SHA} ${INSTALLER_TAG}

      - name: Push installer image
        run: |
          docker push ${{ steps.installer-tag.outputs.tag }}

      - name: Summary
        run: |
          echo "## Talos Installer Built (${{ matrix.variant.name }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Extension Image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tag.outputs.extension }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installer Image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.installer-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo "Update your machine config:" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          echo "machine:" >> $GITHUB_STEP_SUMMARY
          echo "  install:" >> $GITHUB_STEP_SUMMARY
          echo "    image: ${{ steps.installer-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
