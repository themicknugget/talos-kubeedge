name: edgecore
container:
  entrypoint: /edgecore
  args:
    - --config=/var/lib/kubeedge/config/edgecore.yaml
  environment:
    - EDGE_NODE_NAME=mini6
    - EDGE_CLOUDCORE_SERVER=192.168.1.1:10000
  mounts:
    - source: /var/lib/kubeedge
      destination: /var/lib/kubeedge
      type: bind
      options:
        - rshared
        - bind
depends:
  - network:
      - addresses
      - connectivity
      - hostname
  - service: cri
restart: always
logToConsole: false
