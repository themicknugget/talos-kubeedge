name: edgecore
container:
  entrypoint: /edgecore
  args:
    - --config=/var/lib/edgecore/config/edgecore.yaml
  environment:
    - EDGE_NODE_NAME=mini6
    - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  mounts:
    # Libraries for dynamically linked binary
    - source: /lib
      destination: /lib
      type: bind
      options:
        - ro
        - bind
    - source: /usr/lib
      destination: /usr/lib
      type: bind
      options:
        - ro
        - bind
    # Device access
    - source: /dev
      destination: /dev
      type: bind
      options:
        - rshared
        - bind
    # KubeEdge state data (separate from config)
    - source: /var/lib/edgecore
      destination: /var/lib/edgecore
      type: bind
      options:
        - rshared
        - rw
        - bind
security:
  writeableRootfs: true
depends:
  - network:
      - addresses
      - connectivity
      - hostname
  - service: cri
  - configuration: true
restart: always
logToConsole: false
