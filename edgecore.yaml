name: edgecore
container:
  entrypoint: /edgecore
  args:
    - --config=/var/lib/edgecore/config/edgecore.yaml
  environment:
    - EDGE_NODE_NAME=mini6
    - PATH=/usr/local/lib/containers/edgecore/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  mounts:
    # Libraries for dynamically linked binary
    - source: /lib
      destination: /lib
      type: bind
      options:
        - ro
        - bind
    - source: /usr/lib
      destination: /usr/lib
      type: bind
      options:
        - ro
        - bind
    # System binaries (mount, umount, etc. required for volume management)
    - source: /bin
      destination: /bin
      type: bind
      options:
        - ro
        - bind
    - source: /sbin
      destination: /sbin
      type: bind
      options:
        - ro
        - bind
    - source: /usr/bin
      destination: /usr/bin
      type: bind
      options:
        - ro
        - bind
    - source: /usr/sbin
      destination: /usr/sbin
      type: bind
      options:
        - ro
        - bind
    # Device access
    - source: /dev
      destination: /dev
      type: bind
      options:
        - rshared
        - bind
    # Cgroup filesystem (required for edged kubelet functionality)
    - source: /sys/fs/cgroup
      destination: /sys/fs/cgroup
      type: bind
      options:
        - rw
        - bind
    # KubeEdge state data (separate from config)
    - source: /var/lib/edgecore
      destination: /var/lib/edgecore
      type: bind
      options:
        - rshared
        - rw
        - bind
    # Kubelet data directory (edged needs write access)
    - source: /var/lib/kubelet
      destination: /var/lib/kubelet
      type: bind
      options:
        - rshared
        - rw
        - bind
    # Kubelet logging directories
    - source: /var/log/pods
      destination: /var/log/pods
      type: bind
      options:
        - rshared
        - rw
        - bind
    - source: /var/log/containers
      destination: /var/log/containers
      type: bind
      options:
        - rshared
        - rw
        - bind
    # KubeEdge /etc/kubeedge (writable for edged manifests)
    - source: /var/lib/edgecore/etc
      destination: /etc/kubeedge
      type: bind
      options:
        - rshared
        - rw
        - bind
    # CRI socket compatibility (bind host CRI containerd for KubeEdge edged)
    - source: /run/containerd
      destination: /run/containerd
      type: bind
      options:
        - rshared
        - rw
        - bind
security:
  writeableRootfs: true
depends:
  - network:
      - addresses
      - connectivity
      - hostname
  - service: cri
restart: always
logToConsole: false
