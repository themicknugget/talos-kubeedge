# Talos Machine Configuration example for using KubeEdge EdgeCore Extension
# Apply with: talosctl apply-config --insecure --nodes <node-ip> --file machineconfig.yaml

version: v1alpha1
machine:
  type: worker

  install:
    # Use talosctl imager to build a custom installer with the KubeEdge extension:
    # talosctl imager --talos-version=v1.12.5 \
    #   --system-extension-image=ghcr.io/themicknugget/talos-kubeedge:latest \
    #   --output-installer installer.tar.gz
    # Then push to your registry and reference the image here:
    image: <your-registry>/talos-kubeedge-installer:v1.12.5-kubeedge
    wipe: true
    disk: /dev/sda

  network:
    hostname: edge-node-1
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: true

cluster:
  controlPlane:
    endpoint: https://<controlplane-ip>:6443

---
# Extension Service Configuration for EdgeCore
# Apply separately: talosctl create -f edgecore-service.yaml
apiVersion: v1alpha1
kind: ExtensionServiceConfig
metadata:
  name: edgecore
spec:
  configFiles:
    - content: |
        apiVersion: edgecore.config.kubeedge.io/v1alpha2
        kind: EdgeCore
        database:
          dataSource: /var/lib/kubeedge/edgecore.db
        modules:
          edged:
            enabled: true
            nodeName: edge-node-1
          edgehub:
            enabled: true
            heartbeat: 15
            websocket:
              server: <cloudcore-server>
              port: 10000
      mountPath: /etc/kubeedge/config/edgecore.yaml
      permissions: 0600

  environment:
    - name: EDGE_CLOUDCORE_SERVER
      value: "<cloudcore-server>:10000"
    - name: EDGE_NODE_NAME
      value: "edge-node-1"
